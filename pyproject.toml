[project]
name = "pinn-starlight-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "rawpy==0.27.0",
    "tqdm==4.66.5",
    "torch",
    "torchvision",
    "lightning>=2.6.5",
    "jsonargparse[signatures]>=4.50.0",
    "numpy>=2.4.4",
    "pillow>=12.2.0",
    "tifffile>=2026.3.3",
    "segmentation-models-pytorch>=0.5.0",
    "scipy",
    "scipy-stubs",
    "scikit-image>=0.26.0",
    "astropy",
    "photutils",

]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pypi-mirror"
url = "https://mirrors.ustc.edu.cn/pypi/simple"
default = true

[tool.pixi.workspace]
channels = ["https://mirrors.ustc.edu.cn/anaconda/cloud/conda-forge"]
platforms = ["win-64"]

[tool.pixi.dependencies]
python = ">=3.11,<3.12"

[tool.pixi.pypi-options]
index-url = "https://mirrors.ustc.edu.cn/pypi/simple"

[tool.pixi.pypi-dependencies]
pinn-starlight-core = { path = ".", editable = true }
torch = { version = "*", index = "https://download.pytorch.org/whl/cu126" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cu126" }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pixi.tasks]