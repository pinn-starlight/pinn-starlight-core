[project]
name = "pinn-starlight-core"
version = "0.1.0"
description = "Physics-inspired night-sky background estimation experiments"
requires-python = ">=3.11,<3.12"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "rawpy==0.27.0",
    "tqdm==4.66.5",
    "lightning>=2.6.5",
    "jsonargparse[signatures]>=4.50.0",
    "numpy>=2.4.4",
    "pillow>=12.2.0",
    "tifffile>=2026.3.3",
    "segmentation-models-pytorch>=0.5.0",
    "scipy",
    "scipy-stubs",
    "scikit-image>=0.26.0",
    "astropy",
    "photutils",

]

[project.scripts]
pinn-starlight-core = "pinn_starlight_core.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pypi-mirror"
url = "https://mirrors.ustc.edu.cn/pypi/simple"
default = true

[tool.pixi.workspace]
channels = ["https://mirrors.ustc.edu.cn/anaconda/cloud/conda-forge"]
platforms = ["win-64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.11,<3.12"

[tool.pixi.pypi-options]
index-url = "https://mirrors.ustc.edu.cn/pypi/simple"

[tool.pixi.pypi-dependencies]
pinn-starlight-core = { path = ".", editable = true }

# ------------------------------------------------------------------
# CUDA / PyTorch runtime profiles.
# The launchers choose these automatically from the actual GPU/OS.
# ------------------------------------------------------------------

# Known local machine: Windows + RTX 2080 Ti + cu126.
[tool.pixi.feature.local]
platforms = ["win-64"]

[tool.pixi.feature.local.pypi-dependencies]
torch = { version = "==2.14.0", index = "https://download.pytorch.org/whl/cu126" }
torchvision = { version = "==0.29.0", index = "https://download.pytorch.org/whl/cu126" }

[tool.pixi.feature.local.activation.env]
STAGE11_MACHINE_ROLE = "local"
STAGE11_CUDA_PROFILE = "cu126"
STAGE11_PIXI_ENVIRONMENT = "default"

# General rental/remote profile: non-Blackwell NVIDIA GPUs, Win/Linux, cu126.
[tool.pixi.feature.remote]
platforms = ["win-64", "linux-64"]

[tool.pixi.feature.remote.pypi-dependencies]
torch = { version = "==2.14.0", index = "https://download.pytorch.org/whl/cu126" }
torchvision = { version = "==0.29.0", index = "https://download.pytorch.org/whl/cu126" }

[tool.pixi.feature.remote.activation.env]
STAGE11_MACHINE_ROLE = "remote"
STAGE11_CUDA_PROFILE = "cu126"
STAGE11_PIXI_ENVIRONMENT = "remote"

# Blackwell rental/remote profile: RTX 50-series / Blackwell, Win/Linux, cu130.
# It is separate because one Pixi environment cannot dynamically change the
# PyTorch wheel index based on the runtime GPU model.
[tool.pixi.feature.blackwell]
platforms = ["win-64", "linux-64"]

[tool.pixi.feature.blackwell.pypi-dependencies]
torch = { version = "==2.14.0", index = "https://download.pytorch.org/whl/cu130" }
torchvision = { version = "==0.29.0", index = "https://download.pytorch.org/whl/cu130" }

[tool.pixi.feature.blackwell.activation.env]
STAGE11_MACHINE_ROLE = "remote"
STAGE11_CUDA_PROFILE = "cu130"
STAGE11_PIXI_ENVIRONMENT = "remote-blackwell"

[tool.pixi.environments]
default = { features = ["local"], solve-group = "local-cu126" }
dev = { features = ["local", "dev"], solve-group = "local-cu126" }
remote-blackwell = { features = ["blackwell"], solve-group = "remote-cu130" }

[tool.pixi.environments.remote]
features = ["remote"]
solve-group = "remote-cu126"

[tool.pixi.environments.remote.dependencies]
pandas = ">=3.0.5,<4"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pixi.tasks]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["experiments/outputs", "artifacts", "collections"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = [
    # Adding strict= to every zip() would change failure behavior; do it
    # deliberately, one call site at a time.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# These scripts prepend the repo to sys.path before importing project modules.
"tools/*.py" = ["E402"]
# Re-export surfaces.
"src/pinn_starlight_core/physics/__init__.py" = ["F401"]
# objective_one/callback close over loop variables but are consumed by
# minimize() inside the same iteration, so they never escape the loop.
"experiments/common/baselines/cosine_ls.py" = ["B023"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
